name: myapp
description: "A minimalist finance manager MaidPocket."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.2
  intl: ^0.19.0
  image_picker: ^1.1.2
  image_cropper: ^8.0.0
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.1
  firebase_core: ^3.1.1
  cloud_firestore: ^5.0.1
  connectivity_plus: ^6.0.3
  path : ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/